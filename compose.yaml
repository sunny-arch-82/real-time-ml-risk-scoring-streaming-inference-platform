services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
  api:
    build: .
    profiles: [app]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./models:/app/models", "./artifacts:/app/artifacts"]
  mlflow:
    build: .
    profiles: [tracking]
    command: ["uv", "run", "--no-sync", "mlflow", "server", "--backend-store-uri", "sqlite:////app/artifacts/mlflow.db", "--default-artifact-root", "file:///app/artifacts/mlflow-artifacts", "--host", "0.0.0.0", "--port", "5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./artifacts:/app/artifacts", "./models:/app/models"]
volumes:
  kafka-data:
