[project]
name = "riskflow"
version = "0.1.0"
description = "Synthetic transaction risk ML lifecycle and streaming inference"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<1.8",
    "scipy>=1.12,<2",
    "pyarrow>=14,<20",
    "joblib>=1.4,<2",
    "mlflow>=2.22,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<2.1",
]
[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1"]
streaming = ["confluent-kafka>=2.8,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
riskflow = "riskflow.cli:entrypoint"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires optional PySpark and Java"]
[tool.ruff.lint]
select = ["F"]
